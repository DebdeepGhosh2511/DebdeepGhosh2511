<svg width="100%" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#0057FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="180" fill="#0d1117"/>

  <!-- Layer 1 -->
  <g id="layer1">
    <circle cx="150" cy="40" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="6;10;6" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="90" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="6;10;6" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="140" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="6;10;6" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Layer 2 -->
  <g id="layer2">
    <circle cx="500" cy="25" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="65" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="6;10;6" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="105" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="6;10;6" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="145" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="6;10;6" dur="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Layer 3 -->
  <g id="layer3">
    <circle cx="850" cy="40" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="6;10;6" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="90" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="6;10;6" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="140" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="6;10;6" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Output -->
  <circle cx="1100" cy="90" r="8" fill="url(#nodeGlow)"><animate attributeName="r" values="8;14;8" dur="2s" repeatCount="indefinite"/></circle>

  <!-- Connections layer1 -> layer2 -->
  <g stroke="url(#lineGrad)" stroke-width="1.5" fill="none">
    <line x1="150" y1="40" x2="500" y2="25"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></line>
    <line x1="150" y1="40" x2="500" y2="65"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="150" y1="90" x2="500" y2="65"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="2.8s" repeatCount="indefinite"/></line>
    <line x1="150" y1="90" x2="500" y2="105"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="1.9s" repeatCount="indefinite"/></line>
    <line x1="150" y1="140" x2="500" y2="105"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="3.2s" repeatCount="indefinite"/></line>
    <line x1="150" y1="140" x2="500" y2="145"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="2.1s" repeatCount="indefinite"/></line>

    <!-- layer2 -> layer3 -->
    <line x1="500" y1="25" x2="850" y2="40"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="500" y1="65" x2="850" y2="40"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="3.1s" repeatCount="indefinite"/></line>
    <line x1="500" y1="65" x2="850" y2="90"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="2.3s" repeatCount="indefinite"/></line>
    <line x1="500" y1="105" x2="850" y2="90"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="2.9s" repeatCount="indefinite"/></line>
    <line x1="500" y1="105" x2="850" y2="140"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite"/></line>
    <line x1="500" y1="145" x2="850" y2="140"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="2.7s" repeatCount="indefinite"/></line>

    <!-- layer3 -> output -->
    <line x1="850" y1="40" x2="1100" y2="90"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="850" y1="90" x2="1100" y2="90"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="1.8s" repeatCount="indefinite"/></line>
    <line x1="850" y1="140" x2="1100" y2="90"><animate attributeName="stroke-opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></line>
  </g>
</svg>
